# Configuración principal de identificación en SonarCloud
sonar.projectKey=AndresVeraCachoo_aplicacion-robot-agricola
sonar.organization=andresveracachoo
sonar.sourceEncoding=UTF-8

# Definición global de carpetas de código fuente para todo el monorepo
sonar.sources=app/client/src,app/server/src

# Definición global de carpetas de pruebas (Unitarias y E2E)
sonar.tests=app/client/src,app/server/tests

# Ruta única y unificada al archivo de cobertura generado por scripts/merge-coverage.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Patrones para identificar qué archivos son tests
sonar.test.inclusions=**/*.test.js,**/*.test.jsx

# Exclusiones generales del análisis de calidad de código
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/coverage/**,**/*.test.js,**/*.test.jsx,app/client/src/main.jsx,app/client/src/setupTests.js,app/client/vite.config.js,app/server/src/scripts/**,app/server/src/simulator/index.js,app/server/src/index.js,app/server/jest*.js

# Exclusiones explícitas para el cálculo del porcentaje de cobertura
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/coverage/**,**/tests/**,**/*.test.js,**/*.test.jsx,**/scripts/**,**/simulator/index.js,**/src/index.js,app/client/src/main.jsx,app/client/src/setupTests.js,app/client/vite.config.js

# Descomenta la siguiente línea si deseas desactivar por completo el requerimiento de coverage en SonarCloud (ignora todos los archivos para coverage)
# sonar.coverage.exclusions=**/*