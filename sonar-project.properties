sonar.projectKey=andresveracachoo_aplicacion-robot-agricola
sonar.organization=andresveracachoo

# Definir qué es código fuente (Sonar detecta y separa los tests automáticamente)
sonar.sources=app/client/src,app/server/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/coverage/**

# Definir dónde están los tests explícitamente
sonar.tests=app/client/src,app/server/src,app/server/tests
sonar.test.inclusions=**/*.test.js,**/*.test.jsx

# Archivos que no deben contar para la nota de Coverage
sonar.coverage.exclusions=app/client/src/main.jsx,app/server/src/scripts/**,app/server/src/simulator.js,app/server/src/index.js

# Rutas a los reportes de Coverage
sonar.javascript.lcov.reportPaths=app/client/coverage/lcov.info,app/server/coverage/unit/lcov.info,app/server/coverage/e2e/lcov.info

sonar.sourceEncoding=UTF-8