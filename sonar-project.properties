sonar.projectKey=andresveracachoo_aplicacion-robot-agricola
sonar.organization=andresveracachoo

# Dónde está el código fuente (Frontend y Backend)
sonar.sources=app/client/src,app/server/src

# Dónde están los tests
sonar.tests=app/client/src,app/server/src
sonar.test.inclusions=**/*.test.jsx,**/*.test.js

# Archivos que Sonar debe ignorar (para no bajar la nota)
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/coverage/**

# Dónde están los reportes de Coverage 
sonar.javascript.lcov.reportPaths=app/server/coverage/unit/lcov.info,app/server/coverage/e2e/lcov.info,app/client/coverage/lcov.info

sonar.sourceEncoding=UTF-8