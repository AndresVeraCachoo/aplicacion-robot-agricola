name: CI And SonarCloud Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-test-analyze:
    name: Build, Test & Sonar Scan
    runs-on: ubuntu-latest
    
    steps:
      # Descarga el historial completo del repositorio para que Sonar pueda comparar versiones
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # Prepara la máquina virtual con la versión correcta de Node
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # Instala las dependencias de todas las carpetas a la vez
      - name: Install Monorepo Dependencies
        run: npm ci

      # Ejecutamos las pruebas con "continue-on-error: true" para que, 
      # si un test falla, el pipeline no se corte y Sonar pueda registrar el fallo.
      
      - name: Run Frontend Tests & Coverage
        working-directory: ./app/client
        continue-on-error: true 
        run: npm run test:cov

      - name: Run Backend Unit Tests & Coverage
        working-directory: ./app/server
        continue-on-error: true
        run: npm run test:unit:cov

      - name: Run Backend E2E Tests & Coverage
        working-directory: ./app/server
        continue-on-error: true
        run: npm run test:e2e:cov

      # Sube los resultados generados a la plataforma de SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@30dbe5c9eeccb106afb2590dcb61f7a05ffbee14
        if: always() 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}