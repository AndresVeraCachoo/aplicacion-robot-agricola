name: CI And SonarCloud Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-test-analyze:
    name: Build, Test & Sonar Scan
    runs-on: ubuntu-latest
    
    steps:
      # Descargar el código
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obligatorio

      # Preparar el entorno Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          # Busca el lockfile en la raíz de tu monorepo
          cache-dependency-path: 'package-lock.json'

      # Instalar TODAS las dependencias (Cliente y Servidor) desde la raíz
      - name: Install Monorepo Dependencies
        run: npm ci

      # Ejecutar tests SOLO en el backend
      - name: Run Backend Tests & Coverage
        working-directory: ./app/server
        run: npm run test:coverage

      # Enviar a SonarCloud usando el Hash seguro
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@30dbe5c9eeccb106afb2590dcb61f7a05ffbee14
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}